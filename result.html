<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Penilaian</title>
    <script src="https://unpkg.com/read-excel-file@5.5.3/bundle/read-excel-file.min.js"></script>
    <link rel="stylesheet" href="CSS/style_res.css">
</head>
<body>
    <div id="result" class="form-container"><div class="squares"><div></div><div></div><div></div><div></div></div><p style="text-align: center;font-weight: bold;">Memuat Data</p></div>
    
    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbydwL_9AsypEuAY2iKYOTj89LpZHVkaBqqlPvjvZQVM7kfEtz2OiuppzNs3xc0EtOmo/exec";
        
        // Ambil parameter "search dari URL"
        const params = new URLSearchParams(window.location.search);
        const query = params.get("search");
            fetch(`${scriptURL}?nis=${encodeURIComponent(query)}`)
            .then(Response => Response.json())
            .then(data => {
                if (data.length === 0) {
                    document.getElementById("result").innerHTML = `<h1>Hasil Pencarian Nilai</h1>
                    <h2>INFORMATIKA</h2>
                    <p style='color:red;'>Data untuk <strong>"${query}"</strong> tidak ditemukan ❌</p>
                    <p><img src="Img/ngoclan.gif"></p>
                    <button class="btn-nav" onclick="goToPage('index.html')">🔍 Cari Lagi</button>
                    <p>&copy; 2026 Nanur Rev</p>`;
                } else {
            let html = `<h1>Hasil Pencarian Nilai</h1>
                        <h2>INFORMATIKA</h2>
                        <img src="${data[0][3]}" alt="Foto Siswa" class="logo-pict"><br><table>
                        <tr>
                            <th>Nama</th>
                            <th>Kelas</th>
                            <th>Tugas</th>
                            <th>Nilai</th>
                            <th>Status</th>
                        </tr>
                        `;
            data.forEach(row => {
                // Nama dan Kelas ditampilkan sekali, lalu rowspan sesuai jumlah tugas
                let nama = row[1];
                let kelas = row[2];

                // Hitung berapa set tugas (misalnya setiap 3 kolom = Tugas, Nilai, Status)
                let tugasCount = Math.floor((row.length - 3) / 3);

                for (let j = 0; j < tugasCount; j++) {
                    let tugas = row[4 + j*3];
                    let nilai = row[5 + j*3];
                    let status = row[6 + j*3];

                    if (j === 0) {
                    // Baris pertama: tampilkan Nama dan Kelas
              html += `
                        <tr>
                            <td rowspan="${tugasCount}">${nama}</td>
                            <td rowspan="${tugasCount}">${kelas}</td>
                            <td>${tugas}</td>
                            <td>${nilai}</td>
                            <td>${status}</td>
                        </tr>
                        `;
                    } else {
                        // Baris berikutnya hanya : Tugas, Nilai, Status
                        html += `
                        <tr>
                            <td>${tugas}</td>
                            <td>${nilai}</td>
                            <td>${status}</td>
                        </tr>
                        `;
                    }
                }
                        
            });
            html += `</table>
                    <button class="btn-nav" onclick="goToPage('index.html')">🔍 Cari Lagi</button>
                    <p>&copy; 2026 Nanur Rev</p>`;
            document.getElementById("result").innerHTML = html;
          }
        })
        .catch(err => {
          document.getElementById("result").innerHTML = "Error: " + err;
        });function goToPage(page) { window.location.href = page; }
    </script> 
</body>
</html>
