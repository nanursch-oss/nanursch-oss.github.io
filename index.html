<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Countdown PSAJ</title>
  <style>
     body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      color: white;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: url('/Img/pelajar.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    header {
      padding: 20px;
      opacity: 0;
      animation: fadeIn 2s forwards;
    }
    header img {
      height: 120px;
    }

    h1 {
      margin: 20px 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
      opacity: 0;
      animation: fadeIn 2s forwards 1s; /* delay 1 detik */
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
      opacity: 0;
      animation: fadeIn 2s forwards 2s; /* delay 2 detik */
    }
    .countdown div {
      background: rgba(0,0,0,0.5);
      padding: 20px;
      border-radius: 10px;
      min-width: 80px;
    }
    .countdown span {
      display: block;
      font-size: 2em;
      font-weight: bold;
    }
    .label {
      font-size: 0.9em;
      margin-top: 5px;
    }

    footer {
      background: rgba(0,0,0,0.6);
      padding: 10px;
      font-size: 0.9em;
      opacity: 0;
      animation: fadeIn 2s forwards 3s; /* delay 3 detik */
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    /* Overlay */
    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      color: white;
    }
    #overlay button {
      padding: 15px 30px;
      font-size: 1.2em;
      background: #4CAF50;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
    }
    #overlay button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
    <!-- Overlay -->
  <div id="overlay">
    <h2>Persiapan PSAJ</h2>
    <p>Klik tombol di bawah untuk memulai</p>
    <button onclick="startApp()">Mulai</button>
  </div>
  <!-- Logo Sekolah -->
  <header>
    <img src="Img/Logo-Sekolah.png" alt="Logo Sekolah">
  </header>

  <!-- Judul -->
  <h1>Countdown Menuju PSAJ<br>Tahun Pelajaran 2025/2026</h1>

  <!-- Countdown -->
  <div class="countdown">
    <div><span id="days">0</span><div class="label">Hari</div></div>
    <div><span id="hours">0</span><div class="label">Jam</div></div>
    <div><span id="minutes">0</span><div class="label">Menit</div></div>
    <div><span id="seconds">0</span><div class="label">Detik</div></div>
  </div>

  <!-- Footer -->
  <footer>
    Bidang Kurikulum - SMP Negeri 2 Cidahu
  </footer>

  <!-- Backsound -->
  <audio id="Backsound" loop>
    <source src="Music/Hindia - Secukupnya instrumental.mp3" type="audio/mpeg">
    Browser Anda tidak mendukung audio.
  </audio>

  <script>
    // Tentukan tanggal PSAJ
    const targetDate = new Date("May 11, 2026 08:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        document.querySelector(".countdown").innerHTML = "<h2>PSAJ Sedang Berlangsung 🎉</h2>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("seconds").textContent = seconds;

    }

    function startApp() {
      // Hilangkan overlay
      document.getElementById("overlay").style.display = "none";

      // Fade-in elemen
      document.querySelector("header").style.animation = "fadeIn 2s forwards";
      document.querySelector("h1").style.animation = "fadeIn 2s forwards 1s";
      document.querySelector(".countdown").style.animation = "fadeIn 2s forwards 2s";
      document.querySelector("footer").style.animation = "fadeIn 2s forwards 3s";

      // Mulai countdown
      countdownInterval = setInterval(updateCountdown, 1000);

      // Putar musik
      const audio = document.getElementById("Backsound");
      audio.play().catch(err => console.log("Autoplay dibatasi, user harus klik play:", err));
    }
  </script>
</body>
</html>
