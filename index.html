<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Nilai</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>
    <div class="form-container">
        <h1>Aplikasi Cek Nilai</h1>
        <h1>SMP Negeri 2 Cidahu</h1>
        <img src="Img/Logo_Sch.png" alt="Logo Sekolah" class="logo-pict">
        <h2>INFORMATIKA</h2>
            <label for="nama">Masukan Nama Siswa</label>
            <input type="text" id="search" placeholder="Contoh: NANA NURDIYANA">
            <button onclick="searchData()">🔍Cek Nilai</button>
            <script>
                function searchData() {
                    const query = document.getElementById('search').value.toLowerCase();
                    // arahkan ke halaman result.html dengan query di URL
                    window.location.href = `result.html?search=${encodeURIComponent(query)}`;
                }
            </script>
        <p>&copy; 2026 Nanur Rev</p>
    </div>
</body>

</html>
