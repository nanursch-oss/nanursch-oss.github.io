<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: 25% 75%;
            height:fit-content;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .profile-pic:hover {
            transform: scale(1.1);
            border-color: #007bff;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <h1>Coba Gitbash</h1>
    <div class="grid-container">
        <h1>Coba Gitbash</h1>
        <div style="background-color: blanchedalmond; text-align: center;">
            <h3>Nanur Rev</h3>
            <img src="Img/Nanur_PFYT.jpg" alt="Foto Profil" class="profile-pic">
            <p>Nana Nurdiyana</p>
        </div>
        <div style="background-color: white;">
            <h2 style="margin-left: 5%;">Selamat Datang Di Halaman Web Ku</h2>
            <hr>
            <p style="margin-left: 5%; font-weight: bold;">Hello Nama Saya Nana Nurdiyana</p>
            <p style="margin-left: 5%;">Saya merupakan seorang guru di SMP Negeri 2 Cidahu</p>
        </div>
    </div>
    
    
</body>
</html>
